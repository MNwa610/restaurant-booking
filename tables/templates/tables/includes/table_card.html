<article class="card table-card mb-3">
<div class="card-body">
<h2 class="card-title">
Столик N{{ table.number|default:"Без номера" }}
</h2>
<p class="card-text">
Вместимость: {{ table.capacity }} мест
</p>
<p class="card-text">
Расположение: {{ table.location|default:"Не указано" }}
</p>
<p class="card-text">
Активных бронирований: {{ table.active_bookings|length }}
</p>
<a
href="{{ table.get_absolute_url }}"
class="btn btn-primary"
>
Подробнее
</a>
</div>
</article>
